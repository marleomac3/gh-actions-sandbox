name: Hello World Workflow

on:
  workflow_dispatch:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello world and all who inhabit it!!"

  test:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Print message after greeting step
        run: echo "Tests running after build!"
